<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="50%" stop-color="#12132a"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="50%" stop-color="#ff8f3d"/>
      <stop offset="100%" stop-color="#ffca28"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #2a2d54; stroke-width: 1; opacity: 0.3; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 44px; fill: url(#textGrad); letter-spacing: 2px; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 20px; fill: #e2e8f0; letter-spacing: 1px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #00f2fe; }
    
    @keyframes pulseTarget {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    
    @keyframes hudScan {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes particleMove {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translate(40px, -60px); opacity: 0.2; }
    }

    .crosshair-ring { transform-origin: 1050px 160px; animation: pulseTarget 4s infinite ease-in-out; }
    .hud-line { animation: hudScan 6s infinite linear; }
    .p1 { animation: particleMove 5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Background Pattern (Dynamic Graphic Elements in background) -->
  <g class="grid-lines">
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line"/>
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line"/>
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line"/>
    
    <line x1="150" y1="0" x2="150" y2="320" class="grid-line"/>
    <line x1="350" y1="0" x2="350" y2="320" class="grid-line"/>
    <line x1="550" y1="0" x2="550" y2="320" class="grid-line"/>
    <line x1="750" y1="0" x2="750" y2="320" class="grid-line"/>
    <line x1="950" y1="0" x2="950" y2="320" class="grid-line"/>
    <line x1="1150" y1="0" x2="1150" y2="320" class="grid-line"/>
  </g>

  <!-- Animated Particles in Background -->
  <circle cx="200" cy="80" r="3" fill="#ff4b4b" class="p1"/>
  <circle cx="850" cy="240" r="4" fill="#00f2fe" class="p1" style="animation-delay: 1s;"/>
  <circle cx="500" cy="280" r="2" fill="#ff8f3d" class="p1" style="animation-delay: 2s;"/>

  <!-- Futuristic Crosshair Element (Right Side Background Accent) -->
  <g transform="translate(1000, 160)" opacity="0.35">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ff4b4b" stroke-width="1" class="crosshair-ring"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#ff4b4b"/>
    <line x1="-110" y1="0" x2="-20" y2="0" stroke="#00f2fe" stroke-width="2"/>
    <line x1="20" y1="0" x2="110" y2="0" stroke="#00f2fe" stroke-width="2"/>
    <line x1="0" y1="-110" x2="0" y2="-20" stroke="#00f2fe" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="110" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 30,60 L 30,30 L 60,30" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 1170,60 L 1170,30 L 1140,30" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 30,260 L 30,290 L 60,290" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <path d="M 1170,260 L 1170,290 L 1140,290" fill="none" stroke="#00f2fe" stroke-width="3"/>

  <!-- Category Badges / Pills (Layered clearly around main text) -->
  <g transform="translate(60, 55)">
    <rect width="140" height="26" rx="13" fill="#121936" stroke="#00f2fe" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" class="badge-text">🎮 ARENA SHOOTERS</text>
  </g>
  <g transform="translate(210, 55)">
    <rect width="140" height="26" rx="13" fill="#121936" stroke="#ff8f3d" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" class="badge-text" fill="#ff8f3d">💥 TACTICAL FPS</text>
  </g>
  <g transform="translate(360, 55)">
    <rect width="140" height="26" rx="13" fill="#121936" stroke="#ff4b4b" stroke-width="1"/>
    <text x="70" y="17" text-anchor="middle" class="badge-text" fill="#ff4b4b">🔓 OPEN SOURCE</text>
  </g>

  <!-- Main Foreground Content (Title & Subtitle explicitly placed to stay in crisp foreground) -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="title-text" filter="url(#glow)">Awesome First-Person Shooter Games</text>
    <text x="0" y="45" class="subtitle-text">A Curated Collection of Commercial Hit Titles &amp; Open-Source FPS Game Engines</text>
    <text x="0" y="75" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Covers Tactical Shooters, Hero Combat, Arena FPS, Retro Engines, and Game Source Code</text>
  </g>
</svg>
